[[redirects]]
  from = "/bratislava/ua/services/private/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-bratislava/*"
  to = "/bratislava/ua/services/business/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-bratislava/"
  status = 301
