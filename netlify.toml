# Netlify rebuilds the shareable prototype (all pages, noindex) on every push.
[build]
  command = "python3 _build.py --share"
  publish = "_share/site"

# a prototype must never compete with shineguards.com in search
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# the private Airbnb page was removed: Airbnb cleaning lives in the business section
[[redirects]]
  from = "/vienna/ua/services/private/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-vienna/*"
  to = "/vienna/ua/services/business/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-vienna/"
  status = 301
[[redirects]]
  from = "/graz/ua/services/private/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-graz/*"
  to = "/graz/ua/services/business/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-graz/"
  status = 301
[[redirects]]
  from = "/munich/ua/services/private/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-munich/*"
  to = "/munich/ua/services/business/pribirannya-airbnb-ta-korotkostrokovoyi-orendi-in-munich/"
